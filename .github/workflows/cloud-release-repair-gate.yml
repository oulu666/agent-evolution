name: Public column repair gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-release-repair-gate.yml', 'research/release_drift_20261126/repair_gate/run.py']
permissions:
  contents: read
jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        version: ['3.3.0', '3.3.1']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research/release_drift_20261126
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install XlsxWriter==${{ matrix.version }} openpyxl==3.1.5 et-xmlfile==2.0.0
      - run: python research/release_drift_20261126/repair_gate/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: column-${{ matrix.version }}
          path: |
            3.3.*.json
            3.3.*.xlsx
          if-no-files-found: error
