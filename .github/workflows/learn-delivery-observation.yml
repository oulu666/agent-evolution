name: Learn delivery observations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/learn-delivery-observation.yml', 'research/release_drift_20261126/receiver_learning/*.py']
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        task: [copy, jq]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research/release_drift_20261126/clipboard_decision
            research/release_drift_20261126/receiver_learning
      - if: matrix.task == 'jq'
        uses: actions/checkout@v4
        with:
          repository: nst/JSONTestSuite
          ref: 8118969d91d2877e2d4c00db46dca13c932f3d92
          persist-credentials: false
          path: downstream-corpus
          sparse-checkout: |
            test_parsing
            test_transform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: matrix.task == 'copy'
        run: python -m pip install mkdocs-material==9.5.21 mkdocs==1.6.0 Markdown==3.6 pymdown-extensions==10.8.1 Pygments==2.18.0 playwright==1.55.0
      - run: python research/release_drift_20261126/receiver_learning/${{ matrix.task }}_task.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task }}-receipt
          path: ${{ matrix.task }}-receipt.json
