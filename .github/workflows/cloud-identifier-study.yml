name: Document-based identifier study
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-identifier-study.yml']
permissions:
  contents: read
jobs:
  parallel-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research/cloud_identifier_20261125
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/cloud_identifier_20261125/run.py cloud-results
      - run: python research/cloud_identifier_20261125/analyze.py cloud-results
      - uses: actions/upload-artifact@v4
        with:
          name: identifier-results
          path: cloud-results/
          if-no-files-found: error
