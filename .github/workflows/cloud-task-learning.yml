name: Task-level agent learning
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-task-learning.yml']
permissions:
  contents: read
jobs:
  parallel-architectures:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research/cloud_task_learning
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2
      - run: python research/cloud_task_learning/run.py /tmp/wikisql task-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-learning-results
          path: task-results
          if-no-files-found: warn
