name: Active environment teachers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-active-teacher.yml']
permissions:
  contents: read
jobs:
  teach:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research/cloud_task_learning
            research/cloud_active_teacher
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2
      - run: python research/cloud_active_teacher/experiment.py /tmp/wikisql teacher-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teacher-results
          path: teacher-results
          if-no-files-found: warn
