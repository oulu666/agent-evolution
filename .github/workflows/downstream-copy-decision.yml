name: Downstream copy acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/downstream-copy-decision.yml', 'research/release_drift_20261126/clipboard_decision/run.py']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research/release_drift_20261126/clipboard_decision
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install mkdocs-material==9.5.21 mkdocs==1.6.0 Markdown==3.6 pymdown-extensions==10.8.1 Pygments==2.18.0 playwright==1.55.0
      - run: python research/release_drift_20261126/clipboard_decision/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: copy-receipt
          path: copy-results.json
