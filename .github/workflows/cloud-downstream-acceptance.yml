name: Downstream MkDocs acceptance decision
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-downstream-acceptance.yml', 'research/release_drift_20261126/downstream_gate/run.py']
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research/release_drift_20261126/downstream_gate
      - uses: actions/checkout@v4
        with:
          repository: mkdocs/mkdocs
          ref: 00b648f0884244a139f034554b59a032113176f6
          path: consumer
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.8.17 beautifulsoup4==4.13.5 playwright==1.55.0
      - run: python -u research/release_drift_20261126/downstream_gate/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downstream-evidence
          path: gate-results/
          if-no-files-found: warn
